name: Build debug APK

# Builds an installable debug APK on GitHub's runners (which have the Android
# SDK). Download it from the run's "Artifacts", or from the auto-updated
# "debug-latest" pre-release.
on:
  push:
    branches:
      - "claude/android-sms-whatsapp-payments-826lje"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Show APK info
        run: |
          ls -la app/build/outputs/apk/debug/
          echo "APK size:" $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: paygo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to debug-latest pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Paygo debug APK (latest)
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            Latest debug build of Paygo SMS Assistant from
            `claude/android-sms-whatsapp-payments-826lje`.
            Install on a phone with "install unknown apps" enabled for testing.
