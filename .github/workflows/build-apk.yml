name: Build debug APK

# Builds an installable debug APK on GitHub's runners (which have the Android
# SDK). Uses only GitHub-owned actions plus the runner's preinstalled SDK, so it
# runs even under strict "allow GitHub-owned actions only" policies.
#
# HOW TO GET THE APK:
#   This build runs on any push to the feature branch. After it finishes, the
#   APK is available two ways:
#     1. The run's "Artifacts" section (paygo-debug-apk).
#     2. The auto-updated "debug-latest" pre-release (Releases page).
on:
  push:
    branches:
      - "claude/android-sms-whatsapp-payments-826lje"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Show APK info
        run: |
          ls -la app/build/outputs/apk/debug/
          echo "APK size: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: paygo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to debug-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create debug-latest \
            --title "Paygo debug APK (latest)" \
            --notes "Debug build of Paygo SMS Assistant from ${{ github.ref_name }}. Enable 'install unknown apps' on the phone to test." \
            --prerelease \
            --target "${{ github.sha }}" \
            app/build/outputs/apk/debug/app-debug.apk
